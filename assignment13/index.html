<!DOCTYPE html>
<html>
<head>
<title>Interactive UI Cards</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:linear-gradient(135deg,#667eea,#764ba2);
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

/* Title */

.title{
color:white;
font-size:32px;
margin-bottom:30px;
font-weight:bold;
}

/* Card Container */

.container{
display:flex;
flex-wrap:wrap;
gap:25px;
justify-content:center;
}

/* Card */

.card{
background:white;
width:250px;
border-radius:10px;
overflow:hidden;
box-shadow:0 6px 15px rgba(0,0,0,0.2);
transition:0.3s;
}

.card:hover{
transform:translateY(-10px);
}

.card img{
width:100%;
height:150px;
object-fit:cover;
}

.card-content{
padding:15px;
text-align:center;
}

.card-content h3{
margin-bottom:5px;
}

button{
margin-top:10px;
padding:8px 15px;
background:#4f46e5;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

/* Responsive */

@media(max-width:600px){
.container{
flex-direction:column;
align-items:center;
}
}

</style>
</head>

<body>

<h1 class="title">Interactive UI Cards</h1>

<div class="container">

<div class="card">
<img src="https://images.unsplash.com/photo-1519389950473-47ba0277781c">
<div class="card-content">
<h3>Online Course</h3>
<p>Learn Web Development</p>
<button>Start</button>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2">
<div class="card-content">
<h3>Madhu Shree</h3>
<p>UI Designer</p>
<button>Profile</button>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee">
<div class="card-content">
<h3>Blog Post</h3>
<p>Read Latest Articles</p>
<button>Read</button>
</div>
</div>

</div>

</body>
</html>
