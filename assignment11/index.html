<!DOCTYPE html>
<html>
<head>
<title>Final Boss Task Manager</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle at top left,#1f1c2c,#928dab);
}

.container{
    width:600px;
    padding:30px;
    border-radius:20px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    color:white;
    box-shadow:0 0 40px rgba(0,0,0,0.5);
}

h2{
    text-align:center;
    margin-bottom:15px;
}

.stats{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
    font-size:14px;
}

.progress-bar{
    width:100%;
    height:10px;
    background:#333;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:15px;
}

.progress{
    height:100%;
    width:0%;
    background:lime;
    transition:0.4s;
}

input, select{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:none;
    margin-bottom:10px;
}

button{
    padding:6px 10px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.addBtn{
    width:100%;
    background:#00c6ff;
    color:white;
    margin-bottom:15px;
}

ul{
    list-style:none;
}

li{
    background:rgba(255,255,255,0.15);
    padding:10px;
    margin-bottom:10px;
    border-radius:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:grab;
    gap:5px;
}

li.dragging{ opacity:0.5; }

.task-info{
    flex:1;
    display:flex;
    flex-direction:column;
}

.priority{
    font-size:12px;
    padding:2px 6px;
    border-radius:5px;
    width:fit-content;
}

.high{ background:#ff4b5c; }
.medium{ background:#ff9800; }
.low{ background:#4caf50; }

.completed{
    text-decoration:line-through;
    opacity:0.6;
}

.completeBtn{ background:#00e676; color:white; }
.editBtn{ background:#4facfe; color:white; }
.deleteBtn{ background:#ff4b5c; color:white; }

</style>
</head>

<body>

<div class="container">
    <h2>🔥 Final Boss Task Manager</h2>

    <div class="stats">
        <span id="taskCount">Tasks: 0</span>
        <span id="completedCount">Completed: 0</span>
    </div>

    <div class="progress-bar">
        <div class="progress" id="progressBar"></div>
    </div>

    <form id="taskForm">
        <input type="text" id="taskInput" placeholder="Enter task">
        <select id="prioritySelect">
            <option value="high">High Priority</option>
            <option value="medium">Medium Priority</option>
            <option value="low">Low Priority</option>
        </select>
        <button class="addBtn" type="submit">Add Task</button>
    </form>

    <ul id="taskList"></ul>
</div>

<script>

const form=document.getElementById("taskForm");
const taskInput=document.getElementById("taskInput");
const prioritySelect=document.getElementById("prioritySelect");
const taskList=document.getElementById("taskList");
const taskCount=document.getElementById("taskCount");
const completedCount=document.getElementById("completedCount");
const progressBar=document.getElementById("progressBar");

let editingTask=null;

function updateStats(){
    const tasks=document.querySelectorAll("#taskList li");
    const completed=document.querySelectorAll(".completed");

    taskCount.textContent="Tasks: "+tasks.length;
    completedCount.textContent="Completed: "+completed.length;

    let percent= tasks.length===0 ? 0 :
        (completed.length/tasks.length)*100;

    progressBar.style.width=percent+"%";
}

form.addEventListener("submit",function(e){
    e.preventDefault();
    if(taskInput.value==="") return;

    if(editingTask){
        editingTask.querySelector(".task-text").textContent=taskInput.value;
        editingTask=null;
        taskInput.value="";
        return;
    }

    const li=document.createElement("li");
    li.setAttribute("draggable","true");

    const taskInfo=document.createElement("div");
    taskInfo.className="task-info";

    const span=document.createElement("span");
    span.textContent=taskInput.value;
    span.className="task-text";

    const priority=document.createElement("span");
    priority.textContent=prioritySelect.value.toUpperCase();
    priority.className="priority "+prioritySelect.value;

    taskInfo.append(span,priority);

    const completeBtn=document.createElement("button");
    completeBtn.textContent="✔";
    completeBtn.className="completeBtn";
    completeBtn.onclick=()=>{
        span.classList.toggle("completed");
        updateStats();
    };

    const editBtn=document.createElement("button");
    editBtn.textContent="Edit";
    editBtn.className="editBtn";
    editBtn.onclick=()=>{
        taskInput.value=span.textContent;
        editingTask=li;
    };

    const deleteBtn=document.createElement("button");
    deleteBtn.textContent="Delete";
    deleteBtn.className="deleteBtn";
    deleteBtn.onclick=()=>{
        li.remove();
        updateStats();
    };

    li.append(taskInfo,completeBtn,editBtn,deleteBtn);
    taskList.appendChild(li);

    addDragEvents(li);

    taskInput.value="";
    updateStats();
});

/* Drag & Drop */

function addDragEvents(item){
    item.addEventListener("dragstart",()=>item.classList.add("dragging"));
    item.addEventListener("dragend",()=>item.classList.remove("dragging"));
}

taskList.addEventListener("dragover",(e)=>{
    e.preventDefault();
    const dragging=document.querySelector(".dragging");
    const after=getAfterElement(taskList,e.clientY);
    if(after==null){
        taskList.appendChild(dragging);
    }else{
        taskList.insertBefore(dragging,after);
    }
});

function getAfterElement(container,y){
    const elements=[...container.querySelectorAll("li:not(.dragging)")];
    return elements.reduce((closest,child)=>{
        const box=child.getBoundingClientRect();
        const offset=y-box.top-box.height/2;
        if(offset<0 && offset>closest.offset){
            return {offset:offset,element:child};
        }else{
            return closest;
        }
    },{offset:Number.NEGATIVE_INFINITY}).element;
}

</script>

</body>
</html>
